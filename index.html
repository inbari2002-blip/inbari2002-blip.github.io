<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kacki.store</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: black;
    font-family: Arial, sans-serif;
}

/* Full-screen background image */
.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Pink spinning text */
.text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 70px;
    font-weight: bold;
    color: hotpink;
    text-shadow:
        0 0 10px hotpink,
        0 0 20px hotpink,
        0 0 40px hotpink;
    animation: spin 4s linear infinite;
    z-index: 2;
}

/* Bottom-right image */
.corner {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 250px;
    height: auto;
    z-index: 3;
}

@keyframes spin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}
</style>
</head>

<body>

<img src="picture.jpg" class="background" alt="Background">

<div class="text">
    #rishonrishon
</div>

<img src="shaphan.jpeg" class="corner" alt="Corner">

</body>
</html>
