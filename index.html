<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kacki.store</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: black;
    font-family: Arial, sans-serif;
}

/* Full-screen background image */
.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Pink spinning text */
.text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 70px;
    font-weight: bold;
    color: hotpink;
    text-shadow:
        0 0 10px hotpink,
        0 0 20px hotpink,
        0 0 40px hotpink;
    animation: spin 4s linear infinite;
    z-index: 2;
}

/* Bottom-right image */
.corner {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 200px;
    height: auto;
    z-index: 3;
}

.sparkle {
    position: fixed;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    box-shadow:
        0 0 8px white,
        0 0 16px hotpink,
        0 0 24px hotpink;
    animation: sparkle 2s linear forwards;
}

@keyframes sparkle {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-150px) scale(0);
        opacity: 0;
    }
}

@keyframes spin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}
</style>
</head>

<body>

<img src="picture.jpg" class="background" alt="Background">

<div class="text">
    #rishonrishon
</div>

<img src="shaphan.png" class="corner" alt="Corner">

<audio id="bgmusic" loop>
    <source src="agas.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", () => {
    document.getElementById("bgmusic").play();
}, { once: true });
</script>

<script>
function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    sparkle.style.left = Math.random() * window.innerWidth + "px";
    sparkle.style.top = Math.random() * window.innerHeight + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 2000);
}

setInterval(createSparkle, 120);
</script>
</body>
</html>
