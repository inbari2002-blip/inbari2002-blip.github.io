<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kacki.store</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: black;
    font-family: Arial, sans-serif;
}

/* Full-screen background image */
.background {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Pink spinning text */
.text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 70px;
    font-weight: bold;
    color: hotpink;
    text-shadow:
        0 0 10px hotpink,
        0 0 20px hotpink,
        0 0 40px hotpink;
    animation: spin 4s linear infinite;
    z-index: 2;
}

/* Bottom-right image */
.corner {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 200px;
    height: auto;
    z-index: 3;
    cursor: pointer;
    transition: transform 0.2s ease;
    touch-action: manipulation;
}

.corner:hover {
    transform: scale(1.1);
}

.corner:active {
    transform: scale(0.95);
}

.sparkle {
    position: fixed;
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    box-shadow:
        0 0 8px white,
        0 0 16px hotpink,
        0 0 24px hotpink;
    animation: sparkle 2s linear forwards;
}

.burst-sparkle {
    position: fixed;
    width: 10px;
    height: 10px;
    background: hotpink;
    border-radius: 50%;
    pointer-events: none;
    box-shadow:
        0 0 10px hotpink,
        0 0 20px hotpink;
}

@keyframes sparkle {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-150px) scale(0);
        opacity: 0;
    }
}

@keyframes spin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}
</style>
</head>

<body>

<img src="picture.jpg" class="background" alt="Background">

<div class="text">
    #rishonrishon
</div>

<img src="shaphan.png" class="corner" alt="Corner" id="shaphan">

<audio id="bgmusic" loop>
    <source src="agas.mp3" type="audio/mpeg">
</audio>

<script>
document.addEventListener("click", () => {
    document.getElementById("bgmusic").play();
}, { once: true });
</script>

<script>
function createSparkle() {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    sparkle.style.left = Math.random() * window.innerWidth + "px";
    sparkle.style.top = Math.random() * window.innerHeight + "px";

    document.body.appendChild(sparkle);

    setTimeout(() => sparkle.remove(), 2000);
}

setInterval(createSparkle, 120);
</script>

<script>
// Shaphan click handler - creates burst effect
document.getElementById("shaphan").addEventListener("click", function(e) {
    e.stopPropagation();
    e.preventDefault();
    
    const shaphanRect = this.getBoundingClientRect();
    const centerX = shaphanRect.left + shaphanRect.width / 2;
    const centerY = shaphanRect.top + shaphanRect.height / 2;
    
    // Create burst sparkles in all directions
    for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;
        const distance = 150;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        const sparkle = document.createElement("div");
        sparkle.className = "burst-sparkle";
        sparkle.style.left = centerX + "px";
        sparkle.style.top = centerY + "px";
        
        document.body.appendChild(sparkle);
        
        // Use transform directly instead of CSS variables
        let elapsed = 0;
        const startTime = Date.now();
        const duration = 1000;
        
        function animate() {
            elapsed = Date.now() - startTime;
            const progress = elapsed / duration;
            
            if (progress < 1) {
                const currentTx = tx * progress;
                const currentTy = ty * progress;
                const scale = 1 - progress;
                const opacity = 1 - progress;
                
                sparkle.style.transform = `translate(${currentTx}px, ${currentTy}px) scale(${scale})`;
                sparkle.style.opacity = opacity;
                
                requestAnimationFrame(animate);
            } else {
                sparkle.remove();
            }
        }
        
        animate();
    }
    
    console.log("Shaphan clicked! 🎉");
});
</script>
</body>
</html>
