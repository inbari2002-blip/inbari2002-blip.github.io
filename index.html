<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>kacki.store</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: black;
}

img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: Arial, sans-serif;
    font-size: 70px;
    font-weight: bold;
    color: hotpink;
    text-shadow: 0 0 20px hotpink;
    animation: spin 4s linear infinite;
}

@keyframes spin {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}
</style>
</head>

<body>

<img src="picture.jpg" alt="Image">

<div class="text">
#rishonrishon
</div>

</body>
</html>
